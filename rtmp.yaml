version: "3.8"
services:
  rtmp-hls:
    image: alqutami/rtmp-hls:latest-alpine
    container_name: rtmp-hls
    ports:
      - "${streamport}:1935"
      - "${webport}:8080"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      - net-bridge
networks:
  net-bridge:
    external: true
